name: Build resume-build image

# Build and push the resume-build microservice image to GitHub Container
# Registry (GHCR) whenever its files change. Deploy hosts that can pull from
# GHCR (Fly, Railway, a VPS, or Render via an image URL) can then use the
# published image instead of building from source.

on:
  push:
    branches: [main]
    paths:
      - "resume_service/**"
      - ".github/workflows/resume-service.yml"
  pull_request:
    paths:
      - "resume_service/**"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/resume-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push on pushes to main (PRs from forks can't access
      # secrets and shouldn't publish).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./resume_service
          file: ./resume_service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test on PRs: build (already done above with push=false), then run
      # it and hit /health so a broken image never merges.
      - name: Smoke test image (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build -t resume-build:test ./resume_service
          docker run -d --name rb -p 8000:8000 resume-build:test
          for i in $(seq 1 20); do
            if curl -sf localhost:8000/health; then echo " OK"; exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs rb; exit 1
